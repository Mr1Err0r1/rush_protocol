name: Godot-Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  tests:
    name: tests/run_tests.sh (Godot headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot herunterladen
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          "$RUNNER_TEMP/godot" --version

      - name: Testsuite verifizieren
        run: |
          test -f tests/run_tests.sh || { echo "tests/run_tests.sh fehlt"; exit 1; }
          count=$(find tests -maxdepth 1 -type f -name 'test_*.gd' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Keine test_*.gd-Fälle gefunden; CI darf nicht grün durchwinken."
            exit 1
          fi
          echo "Gefundene Testfälle: $count"

      - name: Tests ausführen
        run: GODOT="$RUNNER_TEMP/godot" bash tests/run_tests.sh
